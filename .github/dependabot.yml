# Aggiornamenti settimanali: le action restano fissate a uno SHA e Dependabot propone la nuova versione con
# una PR (da rivedere come ogni altra modifica ai workflow, che gestiscono chiavi e permessi).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

name: Growth

# Review settimanale product/growth (M4, specifica sez. 11-12): lunedi' alle 08 Europe/Rome.
# Metriche PostHog in sola lettura, una proposta motivata (fattibilita' calcolata dal codice) e una bozza di
# brief per Promo Studio. Nulla viene pubblicato o attivato.
# L'orario lo decide tick.yml (lunedi' alle 08 di Roma) avviandolo con scheduled=true.
on:
  workflow_dispatch:
    inputs:
      scheduled:
        description: "Giro pianificato (lo usa tick.yml): niente dry-run, solo alle 08 di Roma"
        type: boolean
        default: false
      dry_run:
        description: "Solo stima: nessuna chiamata AI, nessuna scrittura della proposta"
        type: boolean
        default: true
      force:
        description: "Rifà la proposta anche se esiste gia' per questa settimana"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: supervisor-growth
  cancel-in-progress: false

jobs:
  review:
    if: github.repository == 'michelecoppi/gtp_orchestrator' && (vars.SUP_ENABLED == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUP_ENABLED: ${{ vars.SUP_ENABLED }}
      SUP_AI_ENABLED: ${{ vars.SUP_AI_ENABLED }}
      SUP_STORE: firestore
      SUP_FIRESTORE_PROJECT: ${{ vars.SUP_FIRESTORE_PROJECT }}
      SUP_ADMIN_CHAT_ID: ${{ vars.SUP_ADMIN_CHAT_ID }}
      SUP_POSTHOG_PERSONAL_API_KEY: ${{ secrets.SUP_POSTHOG_PERSONAL_API_KEY }}
      SUP_TELEGRAM_BOT_TOKEN: ${{ secrets.PROMO_APPROVAL_BOT_TOKEN }}
      OPENROUTER_API_KEY: ${{ secrets.SUP_OPENROUTER_API_KEY }}
    steps:
      - name: Solo alle 08 di Roma
        id: gate
        run: |
          if [ "${{ inputs.scheduled }}" = "true" ] && [ "$(TZ=Europe/Rome date +%H)" != "08" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.skip != 'true'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.gate.outputs.skip != 'true'
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt -r requirements-ai.txt -e .
        if: steps.gate.outputs.skip != 'true'
      # Contratti con Promo (issue #11 e #14: promo_posts e promo_brief_decisions): avvisa se uno schema su main
      # di Promo non coincide piu' con la copia in tests/contracts. Solo lettura, nessun segreto; non blocca la
      # review: il riallineamento e' una PR. L'esito va in out/contracts.json per l'avviso su Telegram (sotto).
      - name: Contratti con Promo
        if: steps.gate.outputs.skip != 'true'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          status=0
          out=$(python -m supervisor contracts check --report out/contracts.json 2>&1) || status=$?
          echo "$out"
          if [ "$status" -ne 0 ]; then
            echo "::warning title=Contratti con Promo::$(echo "$out" | head -1)"
            { echo "### Contratti con Promo"; echo; echo "$out"; } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        if: steps.gate.outputs.skip != 'true'
        with:
          workload_identity_provider: ${{ secrets.SUP_WIF_PROVIDER }}
          service_account: ${{ secrets.SUP_WIF_SERVICE_ACCOUNT }}
      # Schema di Promo cambiato o versione nuova: un messaggio a Michele, una volta per cambiamento (chiave
      # prenotata nello stato). "Non verificabile" resta solo nel riepilogo. Come la review, niente invii in
      # dry-run; non blocca la review.
      - name: Avviso contratti su Telegram
        if: steps.gate.outputs.skip != 'true' && (inputs.scheduled || !inputs.dry_run)
        continue-on-error: true
        run: python -m supervisor contracts notify --report out/contracts.json
      - name: Review
        if: steps.gate.outputs.skip != 'true'
        run: |
          args="--out out/growth"
          if [ "${{ inputs.scheduled }}" != "true" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            args="$args --dry-run"
          else
            args="$args --notify"
          fi
          [ "${{ inputs.force }}" = "true" ] && args="$args --force"
          python -m supervisor growth review $args
          [ -f out/growth/review.md ] && cat out/growth/review.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.gate.outputs.skip != 'true'
        with:
          name: growth-${{ github.run_id }}
          path: out/growth/
          retention-days: 90
          if-no-files-found: ignore
      # Se un passo fallisce: avviso diretto su Telegram (curl, senza Python: funziona anche se l'installazione
      # e' proprio cio' che si e' rotto). Nessun effetto se il job riesce o viene annullato.
      - name: Avviso di errore su Telegram
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.PROMO_APPROVAL_BOT_TOKEN }}
          TG_CHAT: ${{ vars.SUP_ADMIN_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW: ${{ github.workflow }}
          JOB: ${{ github.job }}
        run: |
          [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT" ] || exit 0
          text=$(printf '❌ <b>%s fallito</b> · job %s\nIl supervisore potrebbe non aver fatto il suo giro.\n<a href="%s">Apri la run</a>' "$WORKFLOW" "$JOB" "$RUN_URL")
          curl -s -o /dev/null -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
            --data-urlencode "chat_id=$TG_CHAT" --data-urlencode "text=$text" \
            -d parse_mode=HTML -d disable_web_page_preview=true || true

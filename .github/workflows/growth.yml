name: Growth

# Review settimanale product/growth (M4, specifica sez. 11-12): lunedi' alle 08:30 Europe/Rome.
# Metriche PostHog in sola lettura, una proposta motivata (fattibilita' calcolata dal codice) e una bozza di
# brief per Promo Studio. Nulla viene pubblicato o attivato.
on:
  schedule:
    - cron: "30 6,7 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Solo stima: nessuna chiamata AI, nessuna scrittura della proposta"
        type: boolean
        default: true
      force:
        description: "Rifà la proposta anche se esiste gia' per questa settimana"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: supervisor-growth
  cancel-in-progress: false

jobs:
  review:
    if: github.repository == 'michelecoppi/gtp_orchestrator' && (vars.SUP_ENABLED == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUP_ENABLED: ${{ vars.SUP_ENABLED }}
      SUP_AI_ENABLED: ${{ vars.SUP_AI_ENABLED }}
      SUP_STORE: firestore
      SUP_FIRESTORE_PROJECT: ${{ vars.SUP_FIRESTORE_PROJECT }}
      SUP_ADMIN_CHAT_ID: ${{ vars.SUP_ADMIN_CHAT_ID }}
      SUP_POSTHOG_PERSONAL_API_KEY: ${{ secrets.SUP_POSTHOG_PERSONAL_API_KEY }}
      SUP_TELEGRAM_BOT_TOKEN: ${{ secrets.PROMO_APPROVAL_BOT_TOKEN }}
      OPENROUTER_API_KEY: ${{ secrets.SUP_OPENROUTER_API_KEY }}
    steps:
      - name: Solo alle 08:30 di Roma (due cron per l'ora legale)
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(TZ=Europe/Rome date +%H)" != "08" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip != 'true'
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.skip != 'true'
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt -r requirements-ai.txt -e .
        if: steps.gate.outputs.skip != 'true'
      - uses: google-github-actions/auth@v2
        if: steps.gate.outputs.skip != 'true'
        with:
          workload_identity_provider: ${{ secrets.SUP_WIF_PROVIDER }}
          service_account: ${{ secrets.SUP_WIF_SERVICE_ACCOUNT }}
      - name: Review
        if: steps.gate.outputs.skip != 'true'
        run: |
          args="--out out/growth"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            args="$args --dry-run"
          else
            args="$args --notify"
          fi
          [ "${{ inputs.force }}" = "true" ] && args="$args --force"
          python -m supervisor growth review $args
          [ -f out/growth/review.md ] && cat out/growth/review.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always() && steps.gate.outputs.skip != 'true'
        with:
          name: growth-${{ github.run_id }}
          path: out/growth/
          retention-days: 90
          if-no-files-found: ignore

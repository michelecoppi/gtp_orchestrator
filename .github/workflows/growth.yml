name: Growth

# Review settimanale product/growth (M4, specifica sez. 11-12): lunedi' alle 08:30 Europe/Rome.
# Metriche PostHog in sola lettura, una proposta motivata (fattibilita' calcolata dal codice) e una bozza di
# brief per Promo Studio. Nulla viene pubblicato o attivato.
on:
  schedule:
    - cron: "30 6,7 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Solo stima: nessuna chiamata AI, nessuna scrittura della proposta"
        type: boolean
        default: true
      force:
        description: "Rifà la proposta anche se esiste gia' per questa settimana"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: supervisor-growth
  cancel-in-progress: false

jobs:
  review:
    if: github.repository == 'michelecoppi/gtp_orchestrator' && (vars.SUP_ENABLED == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUP_ENABLED: ${{ vars.SUP_ENABLED }}
      SUP_AI_ENABLED: ${{ vars.SUP_AI_ENABLED }}
      SUP_STORE: firestore
      SUP_FIRESTORE_PROJECT: ${{ vars.SUP_FIRESTORE_PROJECT }}
      SUP_ADMIN_CHAT_ID: ${{ vars.SUP_ADMIN_CHAT_ID }}
      SUP_POSTHOG_PERSONAL_API_KEY: ${{ secrets.SUP_POSTHOG_PERSONAL_API_KEY }}
      SUP_TELEGRAM_BOT_TOKEN: ${{ secrets.PROMO_APPROVAL_BOT_TOKEN }}
      OPENROUTER_API_KEY: ${{ secrets.SUP_OPENROUTER_API_KEY }}
    steps:
      - name: Solo alle 08:30 di Roma (due cron per l'ora legale)
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(TZ=Europe/Rome date +%H)" != "08" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.gate.outputs.skip != 'true'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: steps.gate.outputs.skip != 'true'
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt -r requirements-ai.txt -e .
        if: steps.gate.outputs.skip != 'true'
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        if: steps.gate.outputs.skip != 'true'
        with:
          workload_identity_provider: ${{ secrets.SUP_WIF_PROVIDER }}
          service_account: ${{ secrets.SUP_WIF_SERVICE_ACCOUNT }}
      - name: Review
        if: steps.gate.outputs.skip != 'true'
        run: |
          args="--out out/growth"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            args="$args --dry-run"
          else
            args="$args --notify"
          fi
          [ "${{ inputs.force }}" = "true" ] && args="$args --force"
          python -m supervisor growth review $args
          [ -f out/growth/review.md ] && cat out/growth/review.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && steps.gate.outputs.skip != 'true'
        with:
          name: growth-${{ github.run_id }}
          path: out/growth/
          retention-days: 90
          if-no-files-found: ignore
      # Se un passo fallisce: avviso diretto su Telegram (curl, senza Python: funziona anche se l'installazione
      # e' proprio cio' che si e' rotto). Nessun effetto se il job riesce o viene annullato.
      - name: Avviso di errore su Telegram
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.PROMO_APPROVAL_BOT_TOKEN }}
          TG_CHAT: ${{ vars.SUP_ADMIN_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW: ${{ github.workflow }}
          JOB: ${{ github.job }}
        run: |
          [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT" ] || exit 0
          text=$(printf '❌ <b>%s fallito</b> · job %s\nIl supervisore potrebbe non aver fatto il suo giro.\n<a href="%s">Apri la run</a>' "$WORKFLOW" "$JOB" "$RUN_URL")
          curl -s -o /dev/null -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
            --data-urlencode "chat_id=$TG_CHAT" --data-urlencode "text=$text" \
            -d parse_mode=HTML -d disable_web_page_preview=true || true

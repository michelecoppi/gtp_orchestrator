name: Watchdog

# Il supervisore controlla se stesso (M6): ultimo giro di Observe, lock appesi, budget da riconciliare,
# notifiche interrotte. Avvisa su Telegram solo se qualcosa non va (al massimo una volta al giorno per
# problema). Una volta al giorno cancella anche i documenti operativi oltre la conservazione.
# Orari (li decide tick.yml): 07, 11, 15, 19 UTC; Observe gira ogni 3 ore, quindi 4 ore di silenzio sono un problema.
# Il watchdog gira sullo stesso orologio: se si fermano i tick, lo segnala healthchecks.io (docs/runbook.md).
on:
  workflow_dispatch:
    inputs:
      scheduled:
        description: "Giro pianificato (lo usa tick.yml)"
        type: boolean
        default: false
      test:
        description: "Manda un messaggio anche se va tutto bene (verifica del canale)"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: supervisor-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    if: github.repository == 'michelecoppi/gtp_orchestrator' && (vars.SUP_ENABLED == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUP_ENABLED: ${{ vars.SUP_ENABLED }}
      SUP_STORE: firestore
      SUP_FIRESTORE_PROJECT: ${{ vars.SUP_FIRESTORE_PROJECT }}
      SUP_ADMIN_CHAT_ID: ${{ vars.SUP_ADMIN_CHAT_ID }}
      SUP_TELEGRAM_BOT_TOKEN: ${{ secrets.PROMO_APPROVAL_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt -e .
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ secrets.SUP_WIF_PROVIDER }}
          service_account: ${{ secrets.SUP_WIF_SERVICE_ACCOUNT }}
      - name: Controlli
        run: |
          if [ "${{ inputs.scheduled }}" != "true" ] && [ "${{ inputs.test }}" = "true" ]; then
            python -m supervisor watchdog --test
          else
            python -m supervisor watchdog
          fi
      - name: Pulizia dei documenti scaduti (una volta al giorno)
        run: |
          if [ "${{ inputs.scheduled }}" = "true" ] && [ "$(date -u +%H)" != "07" ]; then
            echo "pulizia solo al primo giro del giorno"; exit 0
          fi
          python -m supervisor prune
      # Se un passo fallisce: avviso diretto su Telegram (curl, senza Python: funziona anche se l'installazione
      # e' proprio cio' che si e' rotto). Nessun effetto se il job riesce o viene annullato.
      - name: Avviso di errore su Telegram
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.PROMO_APPROVAL_BOT_TOKEN }}
          TG_CHAT: ${{ vars.SUP_ADMIN_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW: ${{ github.workflow }}
          JOB: ${{ github.job }}
        run: |
          [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT" ] || exit 0
          text=$(printf '❌ <b>%s fallito</b> · job %s\nIl supervisore potrebbe non aver fatto il suo giro.\n<a href="%s">Apri la run</a>' "$WORKFLOW" "$JOB" "$RUN_URL")
          curl -s -o /dev/null -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
            --data-urlencode "chat_id=$TG_CHAT" --data-urlencode "text=$text" \
            -d parse_mode=HTML -d disable_web_page_preview=true || true

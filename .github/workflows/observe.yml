name: Observe

# Giro di osservazione in sola lettura e brief mattutino.
# Gli orari li decide tick.yml (ogni 3 ore di giorno + brief alle 08 di Roma) avviandolo con scheduled=true.
on:
  workflow_dispatch:
    inputs:
      scheduled:
        description: "Giro pianificato (lo usa tick.yml): scrive, notifica, brief solo alle 08 di Roma"
        type: boolean
        default: false
      dry_run:
        description: "Solo lettura: non scrive stato e non invia notifiche"
        type: boolean
        default: true
      brief:
        description: "Scrive anche il brief (e lo invia se dry_run e' false)"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # Workload Identity Federation verso GCP

concurrency:
  group: supervisor-observe
  cancel-in-progress: false

jobs:
  observe:
    # tick.yml non avvia nulla finche' SUP_ENABLED non e' true; a mano si puo' sempre fare un dry-run.
    if: github.repository == 'michelecoppi/gtp_orchestrator' && (vars.SUP_ENABLED == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUP_ENABLED: ${{ vars.SUP_ENABLED }}
      SUP_STORE: firestore
      SUP_FIRESTORE_PROJECT: ${{ vars.SUP_FIRESTORE_PROJECT }}
      SUP_GAME_FIRESTORE_PROJECT: ${{ vars.SUP_GAME_FIRESTORE_PROJECT }}
      SUP_ADMIN_CHAT_ID: ${{ vars.SUP_ADMIN_CHAT_ID }}
      # Bot approvazioni di Promo Studio: solo sendMessage (docs/adr/0002-bot-condiviso.md).
      SUP_TELEGRAM_BOT_TOKEN: ${{ secrets.PROMO_APPROVAL_BOT_TOKEN }}
      # Metriche PostHog (M4), in sola lettura; senza chiave la sorgente e' "non configurata".
      SUP_POSTHOG_PERSONAL_API_KEY: ${{ secrets.SUP_POSTHOG_PERSONAL_API_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt -e .

      - name: Che cosa eseguire
        id: job
        run: |
          if [ "${{ inputs.scheduled }}" = "true" ]; then
            dry=false; brief=false
            [ "$(TZ=Europe/Rome date +%H)" = "08" ] && brief=true
          else
            dry="${{ inputs.dry_run }}"; brief="${{ inputs.brief }}"
          fi
          echo "dry=$dry" >> "$GITHUB_OUTPUT"
          echo "brief=$brief" >> "$GITHUB_OUTPUT"

      # Token GitHub App in sola lettura sui due repository osservati (docs/runbook.md).
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        if: steps.job.outputs.skip != 'true'
        id: app
        with:
          app-id: ${{ vars.SUP_GITHUB_APP_ID }}
          private-key: ${{ secrets.SUP_GITHUB_APP_KEY }}
          owner: michelecoppi
          repositories: guess_the_player_from_the_path,promo_studio
          # Observe legge soltanto: la scrittura esiste solo nel job open-pr di engineer.yml.
          permission-contents: read
          permission-issues: read
          permission-pull-requests: read
          permission-actions: read

      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        if: steps.job.outputs.skip != 'true'
        with:
          workload_identity_provider: ${{ secrets.SUP_WIF_PROVIDER }}
          service_account: ${{ secrets.SUP_WIF_SERVICE_ACCOUNT }}

      - name: Osservazione
        if: steps.job.outputs.skip != 'true'
        env:
          SUP_GITHUB_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          if [ "${{ steps.job.outputs.dry }}" = "true" ]; then
            python -m supervisor observe --dry-run
          else
            python -m supervisor observe --notify-findings
          fi

      # Segue CI e stato delle draft PR del supervisore (M3): conta solo la CI sullo SHA di testa.
      - name: Verifica draft PR
        if: steps.job.outputs.skip != 'true' && steps.job.outputs.dry != 'true'
        env:
          SUP_GITHUB_TOKEN: ${{ steps.app.outputs.token }}
        run: python -m supervisor engineer verify --notify

      # Triage AI solo sui finding nuovi, entro il budget approvato (config/budget.toml) e con modelli
      # verificati nel catalogo. Senza novita' non parte nessuna chiamata.
      - name: Triage AI
        if: steps.job.outputs.skip != 'true' && vars.SUP_AI_ENABLED == 'true'
        env:
          SUP_AI_ENABLED: "true"
          OPENROUTER_API_KEY: ${{ secrets.SUP_OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.SUP_OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.SUP_ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.SUP_GEMINI_API_KEY }}
        run: |
          pip install -r requirements-ai.txt
          if [ "${{ steps.job.outputs.dry }}" = "true" ]; then
            python -m supervisor triage --dry-run
          else
            python -m supervisor triage
          fi

      - name: Brief
        if: steps.job.outputs.skip != 'true' && steps.job.outputs.brief == 'true'
        run: |
          if [ "${{ steps.job.outputs.dry }}" = "true" ]; then
            python -m supervisor report --out out/brief.md
          else
            # Nei giri pianificati al massimo un brief al giorno (tick esterno + riserva di GitHub).
            once=""; [ "${{ inputs.scheduled }}" = "true" ] && once="--once-per-day"
            python -m supervisor report --out out/brief.md --notify $once
          fi

      # Segnale di vita verso healthchecks.io (docs/runbook.md): se non arriva entro l'orario atteso, avvisa
      # Michele da fuori GitHub. Solo nei giri pianificati riusciti, cosi' un dry-run a mano non copre un buco.
      - name: Segnale di vita
        if: success() && inputs.scheduled && steps.job.outputs.dry != 'true'
        env:
          HC_URL: ${{ secrets.SUP_HEALTHCHECK_URL }}
        run: |
          [ -n "$HC_URL" ] || { echo "SUP_HEALTHCHECK_URL non impostato"; exit 0; }
          curl -fsS -m 10 --retry 3 -o /dev/null "$HC_URL" || echo "ping non riuscito"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && steps.job.outputs.brief == 'true'
        with:
          name: brief-${{ github.run_id }}
          path: out/
          retention-days: 14
          if-no-files-found: ignore
      # Se un passo fallisce: avviso diretto su Telegram (curl, senza Python: funziona anche se l'installazione
      # e' proprio cio' che si e' rotto). Nessun effetto se il job riesce o viene annullato.
      - name: Avviso di errore su Telegram
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.PROMO_APPROVAL_BOT_TOKEN }}
          TG_CHAT: ${{ vars.SUP_ADMIN_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW: ${{ github.workflow }}
          JOB: ${{ github.job }}
        run: |
          [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT" ] || exit 0
          text=$(printf '❌ <b>%s fallito</b> · job %s\nIl supervisore potrebbe non aver fatto il suo giro.\n<a href="%s">Apri la run</a>' "$WORKFLOW" "$JOB" "$RUN_URL")
          curl -s -o /dev/null -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
            --data-urlencode "chat_id=$TG_CHAT" --data-urlencode "text=$text" \
            -d parse_mode=HTML -d disable_web_page_preview=true || true

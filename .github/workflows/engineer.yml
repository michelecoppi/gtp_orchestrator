name: Engineer

# Worker engineering (M3): fix piccoli in draft PR per le issue che Michele approva con l'etichetta
# `supervisor:fix` (docs/adr/0004-engineering-worker.md). Tre job con permessi separati:
#   claim   -> token in sola lettura, stato: scopre le approvazioni e reclama un task
#   work    -> token in sola lettura, chiavi AI; il codice patchato gira in Docker senza rete ne' segreti
#   open-pr -> token di scrittura (contents + pull requests), nessuna chiave AI, nessun codice eseguito
# Nessun merge: lo fa Michele dopo la review e la CI verde sullo SHA di testa.
# Gli orari li decide tick.yml (ogni 2 ore di giorno).
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: supervisor-engineer
  cancel-in-progress: false

env:
  SUP_ENABLED: ${{ vars.SUP_ENABLED }}
  SUP_STORE: firestore
  SUP_FIRESTORE_PROJECT: ${{ vars.SUP_FIRESTORE_PROJECT }}
  SUP_ADMIN_CHAT_ID: ${{ vars.SUP_ADMIN_CHAT_ID }}

jobs:
  claim:
    if: github.repository == 'michelecoppi/gtp_orchestrator' && vars.SUP_ENGINEER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      task_id: ${{ steps.claim.outputs.task_id }}
      repo: ${{ steps.claim.outputs.repo }}
      base_sha: ${{ steps.claim.outputs.base_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt -e .
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app
        with:
          app-id: ${{ vars.SUP_GITHUB_APP_ID }}
          private-key: ${{ secrets.SUP_GITHUB_APP_KEY }}
          owner: michelecoppi
          repositories: guess_the_player_from_the_path
          permission-contents: read
          permission-issues: read
          permission-pull-requests: read
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.SUP_WIF_PROVIDER }}
          service_account: ${{ secrets.SUP_WIF_SERVICE_ACCOUNT }}
      - name: Approvazioni e reclamo
        id: claim
        env:
          SUP_GITHUB_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          python -m supervisor engineer scan
          python -m supervisor engineer claim
      # Se un passo fallisce: avviso diretto su Telegram (curl, senza Python: funziona anche se l'installazione
      # e' proprio cio' che si e' rotto). Nessun effetto se il job riesce o viene annullato.
      - name: Avviso di errore su Telegram
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.PROMO_APPROVAL_BOT_TOKEN }}
          TG_CHAT: ${{ vars.SUP_ADMIN_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW: ${{ github.workflow }}
          JOB: ${{ github.job }}
        run: |
          [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT" ] || exit 0
          text=$(printf '❌ <b>%s fallito</b> · job %s\nIl supervisore potrebbe non aver fatto il suo giro.\n<a href="%s">Apri la run</a>' "$WORKFLOW" "$JOB" "$RUN_URL")
          curl -s -o /dev/null -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
            --data-urlencode "chat_id=$TG_CHAT" --data-urlencode "text=$text" \
            -d parse_mode=HTML -d disable_web_page_preview=true || true

  work:
    needs: claim
    if: needs.claim.outputs.task_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      ready: ${{ steps.work.outputs.ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt -r requirements-ai.txt -e .
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app
        with:
          app-id: ${{ vars.SUP_GITHUB_APP_ID }}
          private-key: ${{ secrets.SUP_GITHUB_APP_KEY }}
          owner: michelecoppi
          repositories: guess_the_player_from_the_path
          permission-contents: read
      - name: Repository allo SHA di partenza
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.claim.outputs.repo }}
          ref: ${{ needs.claim.outputs.base_sha }}
          token: ${{ steps.app.outputs.token }}
          path: target
          persist-credentials: false
      # Immagine di controllo: dipendenze installate dallo SHA di partenza, prima che la patch esista.
      - name: Immagine di controllo
        run: |
          python -m supervisor engineer dockerfile --repo "${{ needs.claim.outputs.repo }}" --out check.Dockerfile
          docker build -q -f check.Dockerfile -t gtp-check:latest target
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.SUP_WIF_PROVIDER }}
          service_account: ${{ secrets.SUP_WIF_SERVICE_ACCOUNT }}
      - name: Patch e controlli isolati
        id: work
        env:
          SUP_AI_ENABLED: ${{ vars.SUP_AI_ENABLED }}
          OPENROUTER_API_KEY: ${{ secrets.SUP_OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.SUP_OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.SUP_ANTHROPIC_API_KEY }}
        run: |
          python -m supervisor engineer work --task "${{ needs.claim.outputs.task_id }}" \
            --workspace target --out out --runner docker --image gtp-check:latest
          if [ -f out/patch.diff ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: engineer-${{ needs.claim.outputs.task_id }}
          path: out/
          retention-days: 7
          if-no-files-found: ignore
      # Se un passo fallisce: avviso diretto su Telegram (curl, senza Python: funziona anche se l'installazione
      # e' proprio cio' che si e' rotto). Nessun effetto se il job riesce o viene annullato.
      - name: Avviso di errore su Telegram
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.PROMO_APPROVAL_BOT_TOKEN }}
          TG_CHAT: ${{ vars.SUP_ADMIN_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW: ${{ github.workflow }}
          JOB: ${{ github.job }}
        run: |
          [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT" ] || exit 0
          text=$(printf '❌ <b>%s fallito</b> · job %s\nIl supervisore potrebbe non aver fatto il suo giro.\n<a href="%s">Apri la run</a>' "$WORKFLOW" "$JOB" "$RUN_URL")
          curl -s -o /dev/null -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
            --data-urlencode "chat_id=$TG_CHAT" --data-urlencode "text=$text" \
            -d parse_mode=HTML -d disable_web_page_preview=true || true

  open-pr:
    needs: [claim, work]
    if: needs.work.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt -e .
      # Unico token di scrittura del sistema: branch e draft PR, solo sul repository del gioco.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app
        with:
          app-id: ${{ vars.SUP_GITHUB_APP_ID }}
          private-key: ${{ secrets.SUP_GITHUB_APP_KEY }}
          owner: michelecoppi
          repositories: guess_the_player_from_the_path
          permission-contents: write
          permission-pull-requests: write
          permission-issues: read
      - name: Checkout pulito allo SHA di partenza
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.claim.outputs.repo }}
          ref: ${{ needs.claim.outputs.base_sha }}
          token: ${{ steps.app.outputs.token }}
          path: target
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: engineer-${{ needs.claim.outputs.task_id }}
          path: in
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.SUP_WIF_PROVIDER }}
          service_account: ${{ secrets.SUP_WIF_SERVICE_ACCOUNT }}
      - name: Verifica e draft PR
        env:
          SUP_GITHUB_TOKEN: ${{ steps.app.outputs.token }}
          SUP_GITHUB_WRITE_TOKEN: ${{ steps.app.outputs.token }}
          SUP_TELEGRAM_BOT_TOKEN: ${{ secrets.PROMO_APPROVAL_BOT_TOKEN }}
        run: python -m supervisor engineer open-pr --task "${{ needs.claim.outputs.task_id }}" --workspace target --in in
      # Se un passo fallisce: avviso diretto su Telegram (curl, senza Python: funziona anche se l'installazione
      # e' proprio cio' che si e' rotto). Nessun effetto se il job riesce o viene annullato.
      - name: Avviso di errore su Telegram
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.PROMO_APPROVAL_BOT_TOKEN }}
          TG_CHAT: ${{ vars.SUP_ADMIN_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW: ${{ github.workflow }}
          JOB: ${{ github.job }}
        run: |
          [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT" ] || exit 0
          text=$(printf '❌ <b>%s fallito</b> · job %s\nIl supervisore potrebbe non aver fatto il suo giro.\n<a href="%s">Apri la run</a>' "$WORKFLOW" "$JOB" "$RUN_URL")
          curl -s -o /dev/null -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
            --data-urlencode "chat_id=$TG_CHAT" --data-urlencode "text=$text" \
            -d parse_mode=HTML -d disable_web_page_preview=true || true

name: Evaluate

# Confronto dei modelli (specifica, sez. 14). Solo manuale. Usa il budget dedicato [evaluation] di
# config/budget.toml (contabilita' separata, namespace `eval`) e i modelli del catalogo, anche non ancora
# verificati. Il report finisce nel riepilogo del run e nell'artifact; la scelta dei modelli resta una
# modifica manuale di config/routing.toml.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: "smoke = accesso ai modelli; triage; engineering (casi storici del gioco)"
        type: choice
        options: [smoke, triage, engineering]
        default: smoke
      models:
        description: "Chiavi del catalogo separate da virgola"
        type: string
        default: "gpt-6-luna@openrouter,gemini-3.8-flash@openrouter,claude-sonnet-5@openrouter"
      cases:
        description: "Solo questi casi (id separati da virgola, vuoto = tutti)"
        type: string
        default: ""
      repeat:
        description: "Ripetizioni per caso"
        type: string
        default: "1"
      dry_run:
        description: "Solo stima dei costi"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: supervisor-evaluate-${{ inputs.suite }}
  cancel-in-progress: false

jobs:
  evaluate:
    if: github.repository == 'michelecoppi/gtp_orchestrator'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      SUP_ENABLED: "true"
      SUP_AI_ENABLED: "true"
      SUP_STORE: firestore
      SUP_FIRESTORE_PROJECT: ${{ vars.SUP_FIRESTORE_PROJECT }}
      OPENROUTER_API_KEY: ${{ secrets.SUP_OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt -r requirements-ai.txt -e .
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        id: app
        with:
          app-id: ${{ vars.SUP_GITHUB_APP_ID }}
          private-key: ${{ secrets.SUP_GITHUB_APP_KEY }}
          owner: michelecoppi
          repositories: guess_the_player_from_the_path
          permission-contents: read
          permission-issues: read
      - name: Repository del gioco (storia completa)
        if: inputs.suite == 'engineering'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: michelecoppi/guess_the_player_from_the_path
          token: ${{ steps.app.outputs.token }}
          path: game
          fetch-depth: 0
          persist-credentials: false
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ secrets.SUP_WIF_PROVIDER }}
          service_account: ${{ secrets.SUP_WIF_SERVICE_ACCOUNT }}
      # Credito e limite della chiave OpenRouter (solo numeri, mai la chiave): un 402 vuol dire credito esaurito.
      - name: Credito OpenRouter
        if: inputs.suite == 'smoke'
        run: |
          curl -s -H "Authorization: Bearer $OPENROUTER_API_KEY" https://openrouter.ai/api/v1/key \
            | python -c "import json,sys; d=json.load(sys.stdin).get('data',{}); print('chiave:', {k: d.get(k) for k in ('usage','limit','limit_remaining','is_free_tier')})" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          curl -s -H "Authorization: Bearer $OPENROUTER_API_KEY" https://openrouter.ai/api/v1/credits \
            | python -c "import json,sys; d=json.load(sys.stdin).get('data',{}); print('account:', d)" \
            | tee -a "$GITHUB_STEP_SUMMARY" || true
      - name: Smoke test di accesso
        if: inputs.suite == 'smoke'
        run: |
          status=0
          for model in $(echo "${{ inputs.models }}" | tr ',' ' '); do
            python -m supervisor llm smoke "$model" | tee -a out-smoke.txt || status=1
          done
          { echo '## Smoke test'; echo '```'; cat out-smoke.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - name: Evaluation
        if: inputs.suite != 'smoke'
        env:
          SUP_GITHUB_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          args="--suite ${{ inputs.suite }} --models ${{ inputs.models }} --repeat ${{ inputs.repeat }} --repo-dir game --out out/eval"
          [ -n "${{ inputs.cases }}" ] && args="$args --cases ${{ inputs.cases }}"
          [ "${{ inputs.dry_run }}" = "true" ] && args="$args --dry-run"
          python -m supervisor eval run $args
          [ -f out/eval/report.md ] && cat out/eval/report.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && inputs.suite != 'smoke'
        with:
          name: eval-${{ inputs.suite }}-${{ github.run_id }}
          path: out/eval/
          retention-days: 30
          if-no-files-found: ignore
      # Se un passo fallisce: avviso diretto su Telegram (curl, senza Python: funziona anche se l'installazione
      # e' proprio cio' che si e' rotto). Nessun effetto se il job riesce o viene annullato.
      - name: Avviso di errore su Telegram
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.PROMO_APPROVAL_BOT_TOKEN }}
          TG_CHAT: ${{ vars.SUP_ADMIN_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW: ${{ github.workflow }}
          JOB: ${{ github.job }}
        run: |
          [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT" ] || exit 0
          text=$(printf '❌ <b>%s fallito</b> · job %s\nIl supervisore potrebbe non aver fatto il suo giro.\n<a href="%s">Apri la run</a>' "$WORKFLOW" "$JOB" "$RUN_URL")
          curl -s -o /dev/null -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
            --data-urlencode "chat_id=$TG_CHAT" --data-urlencode "text=$text" \
            -d parse_mode=HTML -d disable_web_page_preview=true || true

name: Budget

# Consultazione e riconciliazione manuale del budget AI (docs/adr/0003). Serve quando una chiamata e' finita
# con esito incerto e si e' verificato (log del run, dashboard del provider) se e' stata addebitata o no.
on:
  workflow_dispatch:
    inputs:
      namespace:
        description: "vuoto = budget operativo, eval = evaluation"
        type: choice
        options: ["", "eval"]
        default: ""
      action:
        description: "show = riepilogo; release-open = rilascia tutte le prenotazioni aperte (non addebitate)"
        type: choice
        options: [show, release-open]
        default: show
      reason:
        description: "Evidenza della riconciliazione (obbligatoria per release-open)"
        type: string
        default: ""

permissions:
  contents: read
  id-token: write

jobs:
  budget:
    if: github.repository == 'michelecoppi/gtp_orchestrator'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUP_STORE: firestore
      SUP_FIRESTORE_PROJECT: ${{ vars.SUP_FIRESTORE_PROJECT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt -e .
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.SUP_WIF_PROVIDER }}
          service_account: ${{ secrets.SUP_WIF_SERVICE_ACCOUNT }}
      - name: Budget
        env:
          NAMESPACE: ${{ inputs.namespace }}
          REASON: ${{ inputs.reason }}
        run: |
          if [ "${{ inputs.action }}" = "release-open" ]; then
            python -m supervisor budget --namespace "$NAMESPACE" --release-open --reason "$REASON"
          fi
          python -m supervisor budget --namespace "$NAMESPACE" | tee -a "$GITHUB_STEP_SUMMARY"
      # Se un passo fallisce: avviso diretto su Telegram (curl, senza Python: funziona anche se l'installazione
      # e' proprio cio' che si e' rotto). Nessun effetto se il job riesce o viene annullato.
      - name: Avviso di errore su Telegram
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.PROMO_APPROVAL_BOT_TOKEN }}
          TG_CHAT: ${{ vars.SUP_ADMIN_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW: ${{ github.workflow }}
          JOB: ${{ github.job }}
        run: |
          [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT" ] || exit 0
          text=$(printf '❌ <b>%s fallito</b> · job %s\nIl supervisore potrebbe non aver fatto il suo giro.\n<a href="%s">Apri la run</a>' "$WORKFLOW" "$JOB" "$RUN_URL")
          curl -s -o /dev/null -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
            --data-urlencode "chat_id=$TG_CHAT" --data-urlencode "text=$text" \
            -d parse_mode=HTML -d disable_web_page_preview=true || true

# Casi di evaluation del triage. Le etichette attese sono una PROPOSTA del supervisore con questo criterio:
# - alta: utenti colpiti adesso o produzione a rischio (deploy/CI di main rotti, pubblicazioni fallite ripetute);
# - media: lavoro bloccato o degradato ma senza impatto immediato sugli utenti;
# - bassa: igiene, attese, informazioni.
# - needs_human = true quando il prossimo passo richiede una decisione o un permesso di Michele
#   (merge, deploy, pubblicazione, approvazione, spesa, configurazione di account).
# Michele: rivedi e correggi le etichette; la evaluation misura l'aderenza a questo criterio.

[[cases]]
id = "ci-main-rossa"
rule = "ci_failed"
subject = "michelecoppi/guess_the_player_from_the_path"
severity = "alta"
statement = "ci.yml fallito su main (run #812, failure, SHA 3f2a9c1)"
evidence = ["https://github.com/michelecoppi/guess_the_player_from_the_path/actions/runs/812"]
expected_priority = "alta"
expected_role = "engineering"
expected_needs_human = false


# Sorgenti osservate dal supervisore. Nessun segreto qui: token e progetti arrivano dall'ambiente.
# Ogni repository produce i flussi #repo, #runs:<workflow>, #issues e #pulls (vedi collectors/github.py).

[[github]]
repo = "michelecoppi/guess_the_player_from_the_path"
expected_default_branch = "main"
ci_workflow = "ci.yml"
deploy_workflow = "deploy.yml"
workflows = ["ci.yml", "deploy.yml", "backup.yml", "restore-verification.yml"]

[[github]]
repo = "michelecoppi/promo_studio"
expected_default_branch = "main"
ci_workflow = "ci.yml"
# promo.yml lo avvia Cloud Scheduler (workflow_dispatch) con i cron di GitHub come riserva: conta ogni run.
workflows = ["ci.yml", "promo.yml"]

[service]
# Il gioco in produzione, controllato ad ogni Observe in sola lettura (collectors/service.py):
# GET / (version, revision = K_REVISION di Cloud Run) e getWebhookInfo del bot (SUP_GAME_BOT_TOKEN).
name = "game"
url = "https://guess-the-player-595902172561.europe-west1.run.app/"
repo = "michelecoppi/guess_the_player_from_the_path"
deploy_workflow = "deploy.yml"
webhook_error_hours = 3
pending_updates_max = 50
deploy_grace_minutes = 30

[promo]
# Coda di Promo Studio nel Firestore del gioco, letta in sola lettura.
collection = "promo_posts"
stale_draft_hours = 24
# Promo prepara le bozze alle 08:37 di Roma (avvio da Cloud Scheduler): se alle 10:00 non ce n'e' nessuna
# per oggi, e nei 3 giorni prima Promo era attivo, il supervisore apre il finding promo_drafts_missing.
drafts_expected_by = "10:00"
active_days = 3

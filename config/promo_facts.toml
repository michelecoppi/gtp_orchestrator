[[facts]]
text = "Si gioca su Telegram, nel bot o nella mini app, con testi in italiano, inglese e spagnolo."
source = "README, Transizione alla mini app Telegram"

[[facts]]
text = "Ci sono classifiche, statistiche personali, eventi tematici a tempo e trofei."
source = "README del gioco, introduzione"

[[facts]]

# Budget AI (specifica, sez. 9). Il tetto e' applicato da core/budget.py con una prenotazione atomica
# in transazione prima di ogni chiamata; questo file fissa solo i valori.
# Finche' `approved = false` nessuna chiamata a pagamento parte, qualunque altra impostazione ci sia.
approved = true
approved_by = "Michele Coppi"
approved_on = "2026-09-28"
currency = "USD"
timezone = "Europe/Rome"
daily_soft_limit = 0.50
daily_hard_limit = 1.00
monthly_soft_limit = 10.00
monthly_hard_limit = 15.00
require_atomic_reservation = true

[limits]
engineering_tasks_per_repo = 1
max_fix_attempts = 2
max_llm_calls_per_task = 8
max_paid_tool_calls_per_task = 3
astra_enabled = false

# Budget dedicato al confronto dei modelli (specifica, sez. 14): contabilita' separata dal tetto operativo.
# Serve un'approvazione esplicita di Michele per ogni ricarica del tetto.
[evaluation]
approved = false
approved_by = ""
approved_on = ""
daily_hard_limit = 5.00
monthly_hard_limit = 10.00
